name: daily-nav-update

# When does AMFI publish?
#   Measured: NAVAll.txt carried Last-Modified 21:15 IST and already contained
#   that day's NAVs by 22:18 IST (checked against the file's own ETag/content).
#   SEBI requires AMCs to declare NAV by 21:00 IST, so the file is rewritten
#   through the evening and can settle as late as ~23:00-23:30 IST on a busy day.
#   => run at least an hour after that window closes.
#
#   00:30 IST primary  = 3h15m after the observed 21:15 refresh, >=1h after a
#                        23:30 worst case.
#   04:00 IST retry    = catches a late file (debt schemes) or a failed run;
#                        the pipeline is idempotent, so a second run is harmless.
on:
  schedule:
    - cron: "0 19 * * *"    # 00:30 IST  (primary)
    - cron: "30 22 * * *"   # 04:00 IST  (retry)
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Ignore saved state and re-download 10 years of NAV history"
        type: boolean
        default: false

permissions:
  contents: write   # to force-push the `state` branch
  pages: write
  id-token: write

concurrency:
  group: daily-nav-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore NAV store from state branch
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.full_rebuild) }}
        run: |
          mkdir -p pipeline/cache
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch --depth=1 origin state
            git show FETCH_HEAD:state.sqlite.gz > pipeline/cache/state.sqlite.gz
            python -m pipeline.cli state-unpack
          else
            echo "no state branch yet — the update step will backfill from scratch"
          fi

      - name: Update NAV store
        run: |
          set -euo pipefail
          if [ -f pipeline/cache/nav.sqlite ]; then
            echo "state restored — incremental update"
            python -m pipeline.cli daily
          else
            echo "no state — downloading 10 years of AMFI history"
            python -m pipeline.cli backfill --years 10 --workers 8
            python -m pipeline.cli daily
          fi

      - name: Build static site
        run: python -m pipeline.cli build

      # Proves the schedule empirically: compare when AMFI last wrote the file with
      # what the build actually picked up. If as_of lags the Last-Modified date for
      # several days, the cron is running too early and needs to move later.
      - name: Record publication timing
        if: always()
        run: |
          set +e
          LM=$(curl -sI --max-time 20 -A "Mozilla/5.0" \
                 https://portal.amfiindia.com/spages/NAVAll.txt \
               | grep -i '^last-modified' | tr -d '\r')
          echo "run started   : $(date -u '+%Y-%m-%d %H:%M UTC') / $(TZ=Asia/Kolkata date '+%H:%M IST')"
          echo "AMFI file     : ${LM:-unavailable}"
          if [ -f dist/data/meta.json ]; then
            python -c "import json;m=json.load(open('dist/data/meta.json'));print('build as_of   :', m['as_of'], '| generated', m['generated_at'])"
          fi

      - name: Persist NAV store to state branch
        run: |
          set -euo pipefail
          python -m pipeline.cli state-pack
          work=$(mktemp -d)
          cp pipeline/cache/state.sqlite.gz "$work/"
          cd "$work"
          git init -q -b state
          git -c user.name="mf-ranker" -c user.email="actions@users.noreply.github.com" \
              add state.sqlite.gz
          git -c user.name="mf-ranker" -c user.email="actions@users.noreply.github.com" \
              commit -qm "state $(date -u +%FT%TZ)"
          # force-push a single-commit branch: the repo never accumulates daily snapshots
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state

      - name: Upload site stats
        run: |
          du -sh dist
          echo "schemes: $(python -c "import json;print(len(json.load(open('dist/data/lookup.json'))))")"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
